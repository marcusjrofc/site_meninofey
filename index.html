<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menino Fey - Linha Capilar</title>
    <link rel="icon" type="image/png" href="./imgs_videos/faviicon.jfif">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <div class="cabecalho">
            <div class="logo"> 
                <img src="./imgs_videos/logo.png" alt="Logo Menino Fey"> 
            </div>
            <div class="links"> 
                <a href="#"></a> 
                <a href="#"></a> 
                <a href="#"></a> 
            </div>
            <div class="butao"> 
                <button id="btn-contato">Botão Secreto</button> 
            </div>
        </div>
    </header>

    <div class="banner"> 
        <img src="./imgs_videos/banner.png" alt="Banner Menino Fey">
        <div class="banner-conteudo"> 
            <span class="subtitulo">LINHA DE CUIDADOS CAPILAR</span>
            <h1>A Beleza do Menino Fey</h1>
            <p class="descricao">Definição natural, hidratação profunda e movimento para deixar seus cachos no ponto certo todos os dias.</p>
        </div>
    </div>

    <section class="section_card">
        <h1 class="titulo-produtos">Nossos Produtos</h1>
        <div class="container_info" id="container-produtos"></div>
    </section>

    <section class="videos">
        <div class="card_videos" id="container-videos"></div>
    </section>

    <div id="modal-imagem" class="modal">
        <span class="close-btn">&times;</span>
        <img class="modal-content-img" src="./imgs_videos/arroganthi.png" alt="Segredo Menino Fey">
    </div>

    <script src="./js/script.js"></script>
</body>
</html>
